services:
  moodle:
    image: ${MOODLE_IMAGE:-moodlehq/moodle-php-apache:8.2}
    ports:
      - "${MOODLE_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./moodle-data/moodledata:/var/www/moodledata
    depends_on:
      - db

  db:
    image: ${MARIADB_IMAGE:-mariadb:10.11}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: ${MOODLE_DATABASE_NAME:-moodle}
      MARIADB_USER: ${MOODLE_DATABASE_USER:-moodle}
      MARIADB_PASSWORD: ${MOODLE_DATABASE_PASSWORD:-moodle123}
    volumes:
      - ./moodle-data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20